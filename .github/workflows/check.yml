# Checks and builds the project. For more info:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24.14']

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: cp .env.development.example .env.development
      - run: cp .env.production.example .env.production
      - run: npx svelte-kit sync
      - run: npx @fuzdev/gro check --workspace --build

  # The cross-backend wire-contract suites (cross_backend_rust / _proxy) run
  # against the Rust `zzz_server`. They need a sibling Rust workspace checkout, a
  # Postgres service, and a cached cargo build, so they run locally
  # (`npm run test:cross`) rather than in CI for now.
